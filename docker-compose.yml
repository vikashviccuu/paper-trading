version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: paper_trading
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/paper_trading?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - APP_ENV=uat
      - CORS_ORIGIN=https://187-127-178-25.sslip.io
      - ZERODHA_REDIRECT_URL=https://187-127-178-25.sslip.io/admin/zerodha/callback
      - KITE_API_KEY=jfwd2gvwal8pq0rp
      - KITE_API_SECRET=a5j4kdo7zr2u57zfpjan8plmctdjun4t
      - ADMIN_SEED_EMAIL=admin@example.com
      - ADMIN_SEED_PASSWORD=admin123456
      - BROKER_PROVIDER=ZERODHA
      - KITE_ACCESS_TOKEN=7CkAjX70hBRT2aWZdcr1BbFRdx4wctzQ
      - ENABLE_DEMO_OTP=true
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
